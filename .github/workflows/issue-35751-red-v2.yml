name: Issue 35751 RED v2

on:
  push:
    branches:
      - fix/35751-compaction-websocket-tools-v2-red
    paths:
      - .github/workflows/issue-35751-red-v2.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@cargo-nextest
      - uses: extractions/setup-just@v3
      - name: Inject regression test only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('codex-rs/core/src/client_tests.rs')
          s = p.read_text()
          marker = '\nfn test_session_telemetry() -> SessionTelemetry {'
          tests = r'''

          #[test]
          fn websocket_incremental_request_for_context_replacement_forces_full_resend() -> anyhow::Result<()> {
              let client = test_model_client(SessionSource::Cli);
              let mut model = test_model_info();
              model.use_responses_lite = true;
              let base_prompt = Prompt {
                  base_instructions: BaseInstructions {
                      text: "base instructions".to_string(),
                      provenance: None,
                  },
                  ..Default::default()
              };
              let build = |prompt: &Prompt| {
                  client.build_responses_request(
                      prompt,
                      &model,
                      /*effort*/ None,
                      codex_protocol::config_types::ReasoningSummary::None,
                      /*service_tier*/ None,
                      &test_responses_metadata_for_client(
                          &client,
                          /*turn_id*/ None,
                          format!("{}:0", client.state.thread_id),
                          /*parent_thread_id*/ None,
                          TestCodexResponsesRequestKind::Turn,
                      ),
                  )
              };

              let warmup_request = build(&base_prompt)?;
              assert!(matches!(
                  warmup_request.input.first(),
                  Some(ResponseItem::AdditionalTools { .. })
              ));

              for replacement in [
                  ResponseItem::Compaction {
                      id: None,
                      encrypted_content: "opaque compaction".to_string(),
                      internal_chat_message_metadata_passthrough: None,
                  },
                  ResponseItem::ContextCompaction {
                      id: None,
                      encrypted_content: Some("opaque context compaction".to_string()),
                      internal_chat_message_metadata_passthrough: None,
                  },
              ] {
                  let mut prompt = base_prompt.clone();
                  prompt.input.push(replacement);
                  let request = build(&prompt)?;

                  let mut session = client.new_session();
                  session.websocket_session.last_request = Some(warmup_request.clone());

                  assert_eq!(
                      session.get_incremental_items(
                          &request,
                          /*last_response*/ None,
                          /*allow_empty_delta*/ true,
                      ),
                      None
                  );
              }
              Ok(())
          }
          '''
          if 'websocket_incremental_request_for_context_replacement_forces_full_resend' in s:
              raise SystemExit('regression test unexpectedly already present')
          if marker not in s:
              raise SystemExit('test insertion marker not found')
          p.write_text(s.replace(marker, tests + marker, 1))
          PY
      - name: Prove RED is the expected assertion failure
        shell: bash
        run: |
          set +e
          just test -p codex-core websocket_incremental_request_for_context_replacement_forces_full_resend 2>&1 | tee /tmp/red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Regression unexpectedly passed before the fix.' >&2
            exit 1
          fi
          grep -q 'websocket_incremental_request_for_context_replacement_forces_full_resend' /tmp/red.log
          grep -Eq 'FAIL|FAILED|assertion.*failed' /tmp/red.log
          echo 'RED_CONFIRMED'
