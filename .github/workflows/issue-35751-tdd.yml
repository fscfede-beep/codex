name: Issue 35751 Verified Fix

on:
  push:
    branches:
      - fix/35751-compaction-websocket-tools
    paths:
      - .github/workflows/issue-35751-tdd.yml
      - codex-rs/core/src/client.rs
      - codex-rs/core/src/client_tests.rs
      - .issue-35751-stage

permissions:
  contents: write

jobs:
  verify:
    if: github.actor == 'fscfede-beep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Confirm RED regression exists
        shell: bash
        run: |
          grep -q 'websocket_incremental_request_for_context_replacement_forces_full_resend' codex-rs/core/src/client_tests.rs
      - name: GREEN - apply minimal production fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('codex-rs/core/src/client.rs')
          s = p.read_text()
          needle = """        if !allow_empty_delta && incremental_items.is_empty() {\n            return None;\n        }\n"""
          replacement = """        // Compaction replaces model context instead of extending it behind
        // `previous_response_id`. A websocket delta would omit the current
        // Responses Lite tool prefix, so force a full request and rebuild it.
        if incremental_items.iter().any(|item| {
            matches!(
                item,
                ResponseItem::Compaction { .. } | ResponseItem::ContextCompaction { .. }
            )
        }) {
            trace!("incremental request failed, context replacement requires full request");
            return None;
        }

        if !allow_empty_delta && incremental_items.is_empty() {
            return None;
        }
"""
          if needle not in s:
              raise SystemExit('production insertion marker not found')
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: GREEN - verify regression
        shell: bash
        run: |
          cargo test -p codex-core websocket_incremental_request_for_context_replacement_forces_full_resend --lib --no-fail-fast
          cargo test -p codex-core websocket_incremental_request_keeps_ordinary_extension_optimization --lib --no-fail-fast
          cargo fmt --all -- --check
          git diff --check
      - name: GREEN - verify codex-core suite
        shell: bash
        run: cargo test -p codex-core --lib --no-fail-fast
      - name: Clean temporary harness and commit
        shell: bash
        run: |
          rm -f .issue-35751-stage .tmp-note-35751 CODEX_35751_TEMP_NOTE.md FINAL_ATTEMPT_NOTE.txt STOP_CREATING_FILES
          git rm -f .github/workflows/issue-35751-tdd.yml || true
          git add codex-rs/core/src/client.rs codex-rs/core/src/client_tests.rs
          git diff --cached --check
          git config user.name 'fscfede-beep'
          git config user.email 'fscfede-beep@users.noreply.github.com'
          git commit -m 'fix: preserve websocket tools across compaction context replacement'
          git push origin HEAD
