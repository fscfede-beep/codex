name: Issue 35751 Verify

on:
  push:
    branches:
      - fix/35751-compaction-websocket-tools
    paths:
      - .github/workflows/issue-35751-verify.yml
      - codex-rs/core/src/client.rs
      - codex-rs/core/src/client_tests.rs

permissions:
  contents: write

jobs:
  verify:
    if: github.actor == 'fscfede-beep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: RED - prove regression
        shell: bash
        run: |
          set +e
          cargo test -p codex-core websocket_incremental_request_for_context_replacement_forces_full_resend --lib --no-fail-fast
          status=$?
          set -e
          test "$status" -ne 0

      - name: GREEN - apply fix and verify
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('codex-rs/core/src/client.rs')
          s = p.read_text()
          marker = '''        if !allow_empty_delta && incremental_items.is_empty() {\n            return None;\n        }\n'''
          fix = '''        // Compaction replaces model context instead of extending it behind\n        // `previous_response_id`. A websocket delta would omit the current\n        // Responses Lite tool prefix, so force a full request and rebuild it.\n        if incremental_items.iter().any(|item| {\n            matches!(\n                item,\n                ResponseItem::Compaction { .. } | ResponseItem::ContextCompaction { .. }\n            )\n        }) {\n            trace!("incremental request failed, context replacement requires full request");\n            return None;\n        }\n\n        if !allow_empty_delta && incremental_items.is_empty() {\n            return None;\n        }\n'''
          if marker not in s:
              raise SystemExit('production insertion marker not found')
          p.write_text(s.replace(marker, fix, 1))
          PY
          cargo test -p codex-core websocket_incremental_request_for_context_replacement_forces_full_resend --lib --no-fail-fast
          cargo test -p codex-core websocket_incremental_request_keeps_ordinary_extension_optimization --lib --no-fail-fast
          cargo test -p codex-core client_tests:: --lib --no-fail-fast
          cargo fmt --all -- --check
          git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'fscfede-beep'
          git config user.email 'fscfede-beep@users.noreply.github.com'
          git add codex-rs/core/src/client.rs codex-rs/core/src/client_tests.rs
          git commit -m 'fix: preserve websocket tools across compaction context replacement'
          git push origin HEAD
