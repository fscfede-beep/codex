name: Issue 35751 Final Verify

on:
  push:
    branches: [fix/35751-compaction-websocket-tools-final]
  pull_request:
    branches: [fix/35751-compaction-websocket-tools-final]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cargo fmt check
        run: cargo fmt --all -- --check
      - name: Targeted compaction/WebSocket regression
        run: cargo test -p codex-core websocket_incremental_request_for_context_replacement_forces_full_resend --lib --no-fail-fast
      - name: Ordinary incremental optimization regression
        run: cargo test -p codex-core websocket_incremental_request_keeps_ordinary_extension_optimization --lib --no-fail-fast
      - name: Core test suite
        run: cargo test -p codex-core --lib --no-fail-fast
